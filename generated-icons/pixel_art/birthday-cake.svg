<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <g id="cake-outline" fill="#5A2F3D" stroke="none">
    <rect x="5" y="8" width="14" height="7" />
    <rect x="4" y="9" width="16" height="6" />
    <rect x="3" y="14" width="18" height="7" />
    <rect x="4" y="21" width="16" height="1" />
  </g>
  <g id="top-layer" fill="#F47B89" stroke="none">
